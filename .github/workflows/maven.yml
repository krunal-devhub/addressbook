name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Upload WAR file as artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-war-file
        path: addressbook/*.war  # Adjust this path to your actual WAR file location

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download WAR file
        uses: actions/download-artifact@v4
        with:
          name: my-war-file  # The name of the artifact uploaded in the build job

      - name: Deploy WAR file
        run: |
          echo "Deploying the WAR file..."
          # Your deployment commands would go here, e.g., copying to a server
